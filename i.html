<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>حكمة 🧠</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="حكمة">
<meta name="theme-color" content="#1A1A2E">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: linear-gradient(180deg, #1A1A2E 0%, #16213E 100%);
    font-family: 'Tajawal', sans-serif;
    margin: 0;
    padding: calc(24px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
    color: #E8E8F0;
    min-height: 100vh;
  }

  .header { text-align: center; padding: 10px 0 20px; }
  .title { font-size: 26px; font-weight: 800; color: #F0E6D2; letter-spacing: -0.3px; }
  .subtitle { font-size: 13px; color: #8B92B0; margin-top: 6px; }

  /* حكمة اليوم */
  .wisdom {
    background: linear-gradient(135deg, #2D2F52, #1F2544);
    border-radius: 20px;
    padding: 22px 20px;
    margin-bottom: 16px;;
    border-right: flex 4px solid #D4AF:7A;
    box-shadow: 0 6 px 20px rgba(0,0,10,0.3);
    position: relative;
    overflow: hidden;
  }
  .wisdom::before {
    content: '💭';
    position: absolute;
    top: -10px; left: 10px;
    font-size: 60px;
    opacity: 0.08;
  }
  .wisdom-label {
    font-size: 11px;
    color: #D4AF7A;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .wisdom-text {
    font-size: 15px;
    line-height: 1.7;
    color: #F0E6D2;
    font-weight: 500;
    margin-bottom: 10px;
  }
  .wisdom-author {
    font-size: 12px;
    color: #8B92B0;
    font-style: italic;
    text-align: left;
  }

  /* شريط التقدم الكلي */
  .overall {
    background: #232844; border-radius: 18px; padding: 16px 20px;
    margin-bottom: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .overall-top {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; font-weight: 700; color: #C8CCE0; margin-bottom: 10px;
  }
  .overall-pct { color: #D4AF7A; font-size: 15px; font-weight: 800; }
  .bar-bg { background: #1A1F38; height: 10px; border-radius: 50px; overflow: hidden; }
  .bar-fill {
    height: 100%; background: linear-gradient(90deg, #8B7BD4, #D4AF7A);
    border-radius: 50px; width: 0%; transition: width 0.6s cubic-bezier(.4,0,.2,1);
  }

  /* بطاقة الفيلسوف */
  .phil-card {
    background: #232844; border-radius: 18px; margin-bottom: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25); overflow: hidden;
    transition: box-shadow 0.3s;
  }
  .phil-card.open { box-shadow: 0 8px 28px rgba(139,123,212,0.3); }

  .phil-head {
    padding: 18px 20px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; user-select: none;
  }
  .phil-info { display: flex; flex-direction: column; }
  .phil-name { font-size: 16px; font-weight: 700; color: #F0E6D2; }
  .phil-tag { font-size: 12px; color: #8B92B0; margin-top: 4px; }
  .phil-icon {
    width: 46px; height: 46px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; margin-right: 12px;
  }
  .icon-lao { background: rgba(100,200,150,0.15); }
  .icon-nietzsche { background: rgba(220,80,80,0.15); }
  .icon-marcus { background: rgba(212,175,122,0.15); }

  .chev { color: #5A6080; font-size: 14px; transition: transform 0.3s; margin-right: 8px; }
  .phil-card.open .chev { transform: rotate(-180deg); }

  .mini-bar { height: 3px; background: #1A1F38; border-radius: 50px; margin: 0 20px; overflow: hidden; }
  .mini-fill { height: 100%; border-radius: 50px; width: 0%; transition: width 0.4s; }
  .fill-lao { background: linear-gradient(90deg, #4ECDC4, #64C896); }
  .fill-nietzsche { background: linear-gradient(90deg, #E85A5A, #C74B4B); }
  .fill-marcus { background: linear-gradient(90deg, #D4AF7A, #B8935A); }

  .ideas { max-height: 0; overflow: hidden; transition: max-height 0.5s cubic-bezier(.4,0,.2,1); }
  .phil-card.open .ideas { max-height: 900px; }
  .ideas-inner { padding: 16px 20px 20px; }

  .idea {
    display: flex; align-items: flex-start; padding: 12px 14px;
    background: #1A1F38; border-radius: 12px; margin-bottom: 8px;
    cursor: pointer; transition: background 0.2s;
  }
  .idea:active { background: #252B4A; }
  .idea.done .idea-text { color: #5A6080; text-decoration: line-through; }
  .idea.done .idea-sub { color: #444A66; }

  .checkbox {
    width: 22px; height: 22px; border: 2px solid #3A4060; border-radius: 7px;
    margin-left: 12px; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s; background: transparent;
  }
  .idea.done .checkbox { background: #D4AF7A; border-color: #D4AF7A; }
  .checkbox::after {
    content: '✓'; color: #1A1A2E; font-size: 14px; font-weight: 800;
    opacity: 0; transition: opacity 0.2s;
  }
  .idea.done .checkbox::after { opacity: 1; }

  .idea-content { flex: 1; }
  .idea-text { font-size: 14px; color: #E8E8F0; line-height: 1.6; font-weight: 500; transition: color 0.2s; }
  .idea-sub { font-size: 12px; color: #8B92B0; line-height: 1.6; margin-top: 4px; transition: color 0.2s; }

  .quote-box {
    background: #1A1F38; border-radius: 12px; padding: 14px 16px;
    margin-top: 12px; border-right: 3px solid #D4AF7A;
    font-size: 13px; color: #C8CCE0; line-height: 1.7; font-style: italic;
  }

  .reset {
    display: block; margin: 26px auto 0; background: transparent;
    border: 1.5px solid #3A4060; color: #8B92B0;
    padding: 10px 22px; border-radius: 50px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .reset:active { background: #232844; color: #D4AF7A; border-color: #D4AF7A; }

  @keyframes pop {
    0% { transform: scale(1); } 50% { transform: scale(0.96); } 100% { transform: scale(1); }
  }
  .pop { animation: pop 0.25s ease; }

  @keyframes sparkle {
    0% { transform: scale(0.5); opacity: 1; }
    100% { transform: scale(2); opacity: 0; }
  }
</style>
</head>
<body>

  <div class="header">
    <div class="title">🧠 حكمة</div>
    <div class="subtitle">ثلاث فلاسفة • رحلة تطوير الذات</div>
  </div>

  <div class="wisdom">
    <div class="wisdom-label">💭 حكمة اليوم</div>
    <div class="wisdom-text" id="wisdomText"></div>
    <div class="wisdom-author" id="wisdomAuthor"></div>
  </div>

  <div class="overall">
    <div class="overall-top">
      <span>✨ إنجازك الكلي</span>
      <span class="overall-pct" id="overallPct">0%</span>
    </div>
    <div class="bar-bg"><div class="bar-fill" id="overallBar"></div></div>
  </div>

  <div id="philosophers"></div>

  <button class="reset" onclick="resetAll()">🔄 إعادة تعيين التقدم</button>

<script>
  const data = [
    {
      id: 'lao',
      icon: '🌿',
      iconClass: 'icon-lao',
      fillClass: 'fill-lao',
      name: 'لاو تزو',
      tag: 'العيش بانسجام مع الحياة',
      ideas: [
        { text: 'لا تجبر الأمور (وو وي)', sub: 'تعاملي مع الظروف بمرونة بدل مقاومة كل شي' },
        { text: 'البساطة', sub: 'قللي تعلقك بالمظاهر والرغبات الزائدة' },
        { text: 'التواضع', sub: 'لا تحتاجين دايماً تثبتين إنك الأفضل' },
        { text: 'تقبّل التغيير', sub: 'الحياة تتغير، والثبات المطلق يسبب المعاناة' }
      ],
      quote: '«كن مرنًا، بسيطًا، ولا تحاول إجبار الحياة على أن تسير كما تريد.»'
    },
    {
      id: 'nietzsche',
      icon: '⚡',
      iconClass: 'icon-nietzsche',
      fillClass: 'fill-nietzsche',
      name: 'فريدريك نيتشه',
      tag: 'اصنع نفسك بنفسك',
      ideas: [
        { text: 'لا تعيشي وفق توقعات الآخرين', sub: 'اسألي: هل أعيش بطريقتي أم بما يتوقعه الناس؟' },
        { text: 'طوّري ذاتك باستمرار', sub: 'لا تتوقفين عند ما أنتِ عليه، تجاوزي ضعفك' },
        { text: 'واجهي الصعوبات', sub: 'المعاناة يمكن أن تكون جزء من نموك' }
      ],
      quote: '«لا تكوني نسخة من الآخرين؛ طوّري نفسك واصنعي قيمك بوعي.»'
    },
    {
      id: 'marcus',
      icon: '🏛️',
      iconClass: 'icon-marcus',
      fillClass: 'fill-marcus',
      name: 'ماركوس أوريليوس',
      tag: 'ركّزي على ما تستطيعين التحكم به',
      ideas: [
        { text: 'فرّقي بين ما تملكينه وما لا تملكينه', sub: 'لا تتحكمين برد فعل الآخرين، لكن تتحكمين في ردك' },
        { text: 'لا تضيفي معاناة إلى المشكلة', sub: 'طريقة تفسيرك للحدث تخفف الألم أو تزيده' },
        { text: 'تذكري أن الوقت محدود', sub: 'قِصر الحياة يجعلك تستخدمين وقتك بوعي' },
        { text: 'افعلي الصواب حتى لو ما شافك أحد', sub: 'تصرفي وفق قيمك، لا وفق نظرات الناس' }
      ],
      quote: '«لا تضيعي طاقتك على ما لا تستطيعين تغييره؛ اهتمي بما تستطيعين فعله الآن.»'
    }
  ];

  const quotes = [
    { text: 'كن مرنًا كالماء، يجد طريقه بين الصخور دون مقاومة.', author: '— لاو تزو' },
    { text: 'من يملك سببًا للعيش، يتحمّل أي طريقة للعيش.', author: '— نيتشه' },
    { text: 'لديك سلطة على عقلك، لا على الأحداث الخارجية. أدركي هذا.', author: '— ماركوس أوريليوس' },
    { text: 'رحلة الألف ميل تبدأ بخطوة واحدة.', author: '— لاو تزو' },
    { text: 'ما لا يقتلني يجعلني أقوى.', author: '— نيتشه' },
    { text: 'الوقت نهر من الأحداث، وتياره قوي. بمجرد ظهور شيء، يمر.', author: '— ماركوس أوريليوس' },
    { text: 'المعرفة الحقيقية هي معرفة مدى جهلك.', author: '— لاو تزو' },
    { text: 'أن تصبح ما أنت عليه، يتطلب أن تكون شجاعًا.', author: '— نيتشه' },
    { text: 'السعادة تعتمد على جودة أفكارك.', author: '— ماركوس أوريليوس' }
  ];

  const STORAGE_KEY = 'hekma_progress_v1';
  let progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

  // حكمة اليوم
  const dayIndex = new Date().getDate() + new Date().getMonth() * 30;
  const todayQuote = quotes[dayIndex % quotes.length];
  document.getElementById('wisdomText').textContent = todayQuote.text;
  document.getElementById('wisdomAuthor').textContent = todayQuote.author;

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }

  function buildUI() {
    const wrap = document.getElementById('philosophers');
    wrap.innerHTML = '';
    data.forEach(p => {
      const card = document.createElement('div');
      card.className = 'phil-card';
      card.dataset.id = p.id;
      card.innerHTML = `
        <div class="phil-head" onclick="toggleCard('${p.id}')">
          <div class="phil-icon ${p.iconClass}">${p.icon}</div>
          <div class="phil-info">
            <span class="phil-name">${p.name}</span>
            <span class="phil-tag" id="tag-${p.id}">${p.tag}</span>
          </div>
          <span class="chev">▼</span>
        </div>
        <div class="mini-bar"><div class="mini-fill ${p.fillClass}" id="mini-${p.id}"></div></div>
        <div class="ideas"><div class="ideas-inner">
          ${p.ideas.map((idea,i) => `
            <div class="idea ${progress[p.id+'_'+i]?'done':''}" onclick="toggleIdea('${p.id}',${i},event)">
              <div class="checkbox"></div>
              <div class="idea-content">
                <div class="idea-text">${idea.text}</div>
                <div class="idea-sub">${idea.sub}</div>
              </div>
            </div>`).join('')}
          <div class="quote-box">${p.quote}</div>
        </div></div>`;
      wrap.appendChild(card);
    });
    updateAll();
  }

  function toggleCard(id) {
    document.querySelector(`.phil-card[data-id="${id}"]`).classList.toggle('open');
  }

  function toggleIdea(pid, idx, event) {
    const key = pid + '_' + idx;
    progress[key] = !progress[key];
    save();
    const card = document.querySelector(`.phil-card[data-id="${pid}"]`);
    const el = card.querySelectorAll('.idea')[idx];
    el.classList.toggle('done', progress[key]);
    el.classList.add('pop');
    setTimeout(() => el.classList.remove('pop'), 250);
    updateCard(pid); updateAll();
  }

  function updateCard(pid) {
    const p = data.find(x => x.id === pid);
    const done = p.ideas.filter((_,i) => progress[pid+'_'+i]).length;
    const pct = (done / p.ideas.length) * 100;
    document.getElementById('mini-'+pid).style.width = pct + '%';
    const tagEl = document.getElementById('tag-'+pid);
    if (done === p.ideas.length) {
      tagEl.textContent = `✨ ${p.name} مكتمل!`;
      tagEl.style.color = '#D4AF7A';
    } else {
      tagEl.textContent = `${p.tag} • ${done}/${p.ideas.length}`;
      tagEl.style.color = '';
    }
  }

  function updateAll() {
    let total = 0, doneAll = 0;
    data.forEach(p => {
      total += p.ideas.length;
      doneAll += p.ideas.filter((_,i) => progress[p.id+'_'+i]).length;
      updateCard(p.id);
    });
    const pct = total ? Math.round((doneAll/total)*100) : 0;
    document.getElementById('overallBar').style.width = pct + '%';
    document.getElementById('overallPct').textContent = pct + '%';
  }

  function resetAll() {
    if (!confirm('متأكد تبغين تصفّرين كل التقدم؟')) return;
    progress = {}; save(); buildUI();
  }

  buildUI();
</script>
</body>
</html>
